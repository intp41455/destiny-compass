name = "destiny-compass"
main = "dist/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 生产环境配置
[env.production]
name = "destiny-compass-prod"

[vars]
LLM_BASE_URL = "https://api.agnes-ai.cn/v1"
LLM_MODEL = "agnes-2.5-flash"

[build]
command = "npx tsc"
watch_dir = ["src"]
