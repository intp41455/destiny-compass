name = "destiny-compass"
main = "dist/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# account_id 通过环境变量 CLOUDFLARE_ACCOUNT_ID 提供

[vars]
LLM_BASE_URL = "https://api.agnes-ai.cn"
LLM_MODEL = "agnes-2.5-flash"

[build]
command = "cd ../../ && pnpm --filter @destiny/cloudflare-worker build"
watch_dir = ["src"]

[env.production]
name = "destiny-compass-prod"

[env.production.vars]
LLM_BASE_URL = "https://api.agnes-ai.cn"
LLM_MODEL = "agnes-2.5-flash"
