name = "destiny-compass"
main = "dist/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 注意：account_id 需要通过环境变量 CLOUDFLARE_ACCOUNT_ID 提供，
# 或在 Cloudflare 仪表盘中设置默认值

[vars]
LLM_BASE_URL = "https://api.agnes-ai.cn/v1"
LLM_MODEL = "agnes-2.5-flash"

[build]
command = "npx tsc"
watch_dir = ["src"]

[env.production]
name = "destiny-compass-prod"
