name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/cloudflare-worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build and Deploy to Cloudflare Workers
        working-directory: packages/cloudflare-worker
        run: |
          npx wrangler deploy \
            --var LLM_BASE_URL:${{ vars.LLM_BASE_URL || 'https://api.agnes-ai.cn/v1' }} \
            --var LLM_MODEL:${{ vars.LLM_MODEL || 'agnes-2.5-flash' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
